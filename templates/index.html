<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Quest Automation Engine</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glow-bg-top"></div>
    <div class="glow-bg-bottom"></div>

    <header class="navbar">
        <div class="nav-left">
            <div class="logo-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            </div>
            <div class="nav-title-wrap">
                <span class="nav-brand">QUEST ENGINE</span>
                <span class="nav-env-tag">PROD</span>
            </div>
        </div>

        <div class="nav-right">
            <div class="user-status-pill" id="userPill">
                <span class="status-indicator-ring"></span>
                <span class="user-name-text">Disconnected</span>
            </div>
        </div>
    </header>

    <main class="dashboard-grid">
        <aside class="control-sidebar">
            <div class="panel-card auth-card">
                <div class="panel-header">
                    <span class="panel-title">Authentication</span>
                    <span class="panel-subtitle">Discord User Token</span>
                </div>
                
                <div class="input-wrapper">
                    <input type="password" id="tokenInput" class="custom-input" placeholder="Paste discord token..." spellcheck="false" autocomplete="off">
                    <button class="icon-action-btn" id="showBtn" onclick="toggleToken()" title="Toggle Visibility">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>

                <div class="action-btn-group">
                    <button class="btn btn-connect" id="connectBtn" onclick="doConnect()">
                        <span>Connect Session</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
                    </button>
                </div>
            </div>

            <div class="panel-card telemetry-card">
                <div class="panel-header">
                    <span class="panel-title">Telemetry</span>
                </div>
                <div class="telemetry-grid">
                    <div class="telemetry-box">
                        <span class="telemetry-label">DISCOVERED</span>
                        <span class="telemetry-val" id="statTotal">—</span>
                    </div>
                    <div class="telemetry-box">
                        <span class="telemetry-label">PENDING</span>
                        <span class="telemetry-val" id="statAvail">—</span>
                    </div>
                    <div class="telemetry-box highlight">
                        <span class="telemetry-label">SOLVED</span>
                        <span class="telemetry-val" id="statDone">—</span>
                    </div>
                </div>
            </div>

            <div class="panel-card actions-card">
                <div class="panel-header">
                    <span class="panel-title">Batch Selection</span>
                </div>
                <div class="btn-dual-grid">
                    <button class="btn btn-secondary" onclick="selectAll()">Select All</button>
                    <button class="btn btn-secondary" onclick="deselectAll()">Deselect</button>
                </div>
                <button class="btn btn-secondary w-full" id="refreshBtn" onclick="doRefresh()">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
                    <span>Refresh Quests</span>
                </button>
            </div>
        </aside>

        <section class="workspace-area">
            <div class="workspace-section quest-queue-section">
                <div class="workspace-header">
                    <div class="section-tag-wrap">
                        <span class="section-heading" id="questHeader">QUEST QUEUE</span>
                        <span class="count-badge" id="questCountBadge">0</span>
                    </div>
                </div>
                
                <div class="quest-deck" id="questScroll">
                    <div class="empty-state-canvas">
                        <div class="empty-icon-ring">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 12 2 2 4-4"/></svg>
                        </div>
                        <p class="empty-lead">No missions loaded</p>
                        <p class="empty-sub">Connect your token to sync available Discord rewards</p>
                    </div>
                </div>
            </div>

            <div class="workspace-section logs-console-section">
                <div class="console-topbar">
                    <div class="console-left">
                        <span class="terminal-dot red"></span>
                        <span class="terminal-dot yellow"></span>
                        <span class="terminal-dot green"></span>
                        <span class="console-title">TERMINAL OUTPUT</span>
                    </div>
                    <button class="console-clear-btn" onclick="clearLog()">Clear Stream</button>
                </div>
                <div class="console-stream" id="logBox"></div>
            </div>
        </section>
    </main>

    <footer class="dock-footer">
        <div class="dock-status">
            <span class="dock-status-pulse" id="statusPulse"></span>
            <span class="dock-status-text" id="statusText">System Ready</span>
        </div>
        <div class="dock-controls">
            <button class="btn btn-abort" id="stopBtn" onclick="doStop()" disabled>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
                <span>Abort Queue</span>
            </button>
            <button class="btn btn-execute" id="startBtn" onclick="doStart()" disabled>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                <span>Execute Quests</span>
            </button>
        </div>
    </footer>

    <script src="/static/app.js"></script>
</body>
</html>
